<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 1rem;
            background: whitesmoke;
            display: flex;
            flex-direction: column;
            height: 100vh;
            gap: 1rem;
            box-sizing: border-box;
        }

        header,
        footer {
            background: #1e90ff;
            border-radius: 0.5rem;
            padding: 1rem;
            box-shadow: 0 4px 0 #1d44b8;
            color: aliceblue;
        }

        main {
            display: flex;
            flex-grow: 1;
            gap: 1rem;
        }

        .main {
            flex-grow: 1;
            background: #3cb371;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            color: aliceblue;
            box-shadow: 0 4px 0 #2f8d59;
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }

        .item {
            width: 5rem;
            height: 5rem;
            background: #2f8d59;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: aliceblue;
            box-shadow: 0 4px 0 #226741;
        }

        .sidebar {
            width: 10rem;
            background: #ff6347;
            border-radius: 0.5rem;
            padding: 1rem;
            box-shadow: 0 4px 0 #e02200;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <header>header</header>
    <main>
        <section class="main">
            main
            <div class="items">
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </div>
            
        </section>
        <section class="sidebar">sidebar</section>
    </main>
    <footer>footer</footer>
</body>
</html>
