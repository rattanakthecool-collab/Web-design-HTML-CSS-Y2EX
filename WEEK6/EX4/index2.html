<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4 - Clamp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .wrapper { padding: 20px; }

    .content {
      /* min 300px, in between 100%, max 800px */
      width: clamp(300px, 100%, 800px);
      height: 300px;
      background: yellow;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="content"></div>
  </div>
</body>
</html>
